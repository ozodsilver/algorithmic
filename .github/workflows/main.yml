name: Nuxt SSR Build and Deploy

on:
  push:
    branches: [ "algo-main" ]
  pull_request:
    branches: [ "algo-main" ]

jobs:
  notify_start:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Get Commit Message
      id: commit_message
      run: echo "COMMIT_MSG=$(git log -1 --pretty=format:%s)" >> $GITHUB_ENV
    - name: Escape Commit Message for MarkdownV2
      run: |
        COMMIT_MSG_ESCAPED=$(echo $COMMIT_MSG | sed 's/[_*\\[\\]()~`>#+-=|{}.!]/\\\\&/g' | sed ':a;N;$!ba;s/\n/%0A/g')
        echo "COMMIT_MSG_ESCAPED=$COMMIT_MSG_ESCAPED" >> $GITHUB_ENV
    - name: Send Telegram Notification on CI/CD Start
      run: |
        curl -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
        -d chat_id="${{ vars.TELEGRAM_CHAT_ID }}" \
        -d message_thread_id="${{ vars.TELEGRAM_TOPIC_ID  }}" \
        -d text="🚀 *Nuxt SSR CI\\/CD Pipeline Started\\!*%0A%0A_Commit Message:_%0A\`\`\`commit%0A${{ env.COMMIT_MSG_ESCAPED }}%0A\`\`\`" \
        -d parse_mode="MarkdownV2"

  build_and_deploy:
    runs-on: ubuntu-latest
    needs: notify_start
    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build Nuxt SSR
      run: npm run build
      
    # - name: Upload via SFTP
    #   uses: pressidium/lftp-mirror-action@v1
    #   with:
    #     server: ${{ secrets.FTP_SERVER }}
    #     port: 2100
    #     username: ${{ secrets.FTP_USERNAME }}
    #     password: ${{ secrets.FTP_PASSWORD }}
    #     localDir: .output/
    #     remoteDir: ${{ vars.FTP_PROD_SERVER_DIR }}
    #     protocol: sftp
      
    - name: Upload .output to IIS via FTP
      uses: SamKirkland/FTP-Deploy-Action@v4.3.4
      with:
        server: ${{ secrets.FTP_SERVER }}
        port: "2100"
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: .output/
        server-dir: ${{ vars.FTP_PROD_SERVER_DIR }}
        protocol: ftps
        dangerous-clean-slate: true
  
  notify_success:
    runs-on: ubuntu-latest
    needs: build_and_deploy
    if: success()
    steps:
    - name: Send Telegram Notification on CI/CD Success
      run: |
        curl -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
        -d chat_id="${{ vars.TELEGRAM_CHAT_ID }}" \
        -d message_thread_id="${{ vars.TELEGRAM_TOPIC_ID  }}" \
        -d text="✅ *Nuxt SSR CI\\/CD Succeeded\\!*%0A%0A📦 Your Nuxt app has been deployed successfully to IIS\\.%0A🖥 It should now be running on your server\\." \
        -d parse_mode="MarkdownV2"

  notify_failure:
    runs-on: ubuntu-latest
    needs: build_and_deploy
    if: failure()
    steps:
    - name: Get Commit Message Again
      run: echo "COMMIT_MSG=$(git log -1 --pretty=format:%s)" >> $GITHUB_ENV
    - name: Escape Commit Message for MarkdownV2
      run: |
        COMMIT_MSG_ESCAPED=$(echo $COMMIT_MSG | sed 's/[_*\\[\\]()~`>#+-=|{}.!]/\\\\&/g' | sed ':a;N;$!ba;s/\n/%0A/g')
        echo "COMMIT_MSG_ESCAPED=$COMMIT_MSG_ESCAPED" >> $GITHUB_ENV
    - name: Send Telegram Notification on CI/CD Failure
      run: |
        curl -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
        -d chat_id="${{ vars.TELEGRAM_CHAT_ID }}" \
        -d message_thread_id="${{ vars.TELEGRAM_TOPIC_ID  }}" \
        -d text="❌ *Nuxt SSR CI\\/CD Failed\\!*%0A%0A_Commit Message:_%0A\`\`\`commit%0A${{ env.COMMIT_MSG_ESCAPED }}%0A\`\`\`%0A%0A⚠️ Deployment error occurred, please check GitHub logs\\." \
        -d parse_mode="MarkdownV2"